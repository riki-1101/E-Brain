<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>リスト表示画面</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header"></header>
    <main id="list">
        <ul id="phrase-list"></ul>
        <div id="popup">
            <div id="popup-content">
                <p id="popup-en"></p>
                <p id="popup-ja"></p>
                <div id="popup-examples"></div>
                <button id="close">×</button>
            </div>
        </div>
    </main>
    <footer id="footer"></footer>
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/script.js"></script>
    <script>
        let jsonData = [];

        const fileName = localStorage.getItem("selectedId_list");
        const ul = document.getElementById("phrase-list");
        fetch(`../json/${fileName}.json`)
        .then(res => res.json())
        .then(data => {
            jsonData = data;
            updateList();
        });

        const popup = document.getElementById("popup");
        const popupEn = document.getElementById("popup-en");
        const popupJa = document.getElementById("popup-ja");
        const closeBtn = document.getElementById("close");
        const popupExamples = document.getElementById("popup-examples");

        function updateList(){
            ul.innerHTML = "";
            jsonData
            .forEach(item => {
                const li = document.createElement("li");
                const en = document.createElement("div");
                en.className = "en";
                en.textContent = item.en;
                const ja = document.createElement("div");
                ja.className = "ja";
                ja.textContent = item.ja;

                // 🔊 読み上げボタン
                const speakBtn = document.createElement("button");
                speakBtn.textContent = "🔊";
                speakBtn.className = "speak-btn";

                speakBtn.addEventListener("click", (e) => {
                    e.stopPropagation(); // ← liクリック（ポップアップ）を防ぐ
                    speakEnglish(item.en);
                });

                const textWrap = document.createElement("div");
                textWrap.className = "text-wrap";
                textWrap.appendChild(en);
                textWrap.appendChild(ja);
                li.appendChild(textWrap);
                li.appendChild(speakBtn);
                ul.appendChild(li);

                li.addEventListener("click", () => {
                    popupEn.textContent = item.en;
                    popupJa.textContent = item.ja;

                    // 以前の例文を削除
                    popupExamples.innerHTML = "";

                    // ex が存在しない場合は空配列として扱う
                    const examples = item.ex || [];

                    examples.forEach(example => {
                        const exampleEn = document.createElement("p");
                        exampleEn.className = "example-en";
                        exampleEn.textContent = example.en;

                        const exampleJa = document.createElement("p");
                        exampleJa.className = "example-ja";
                        exampleJa.textContent = example.ja;

                        const exampleBlock = document.createElement("div");
                        exampleBlock.className = "example";

                        exampleBlock.appendChild(exampleEn);
                        exampleBlock.appendChild(exampleJa);

                        popupExamples.appendChild(exampleBlock);
                    });

                    popup.style.display = "flex";
                    document.body.classList.add("no-scroll");
                });
            });
        }

        closeBtn.addEventListener("click", () => {
            popup.style.display = "none";
            document.body.classList.remove("no-scroll");
        });

        // 背景クリックで閉じる
        popup.addEventListener("click", (e) => {
            if (e.target === popup) {
                popup.style.display = "none";
                document.body.classList.remove("no-scroll");
            }
        });
    </script>
</body>
</html>
